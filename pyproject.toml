[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-koopman-models"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "torch==2.1.2", "scikit-learn==1.3.0", "gymnasium==1.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
